name: Release PRs

# Shared release PR job. Each repo calls it on pushes to its stage branches, and it keeps the PR into the next stage
# open: dev -> qa -> staging -> the default branch, skipping any of qa and staging the repo doesn't have.
# New release PRs get auto-merge, so one approval ships each stage.
# The calling repo needs a "release" environment, limited to its stage branches, holding avcan-it's RELEASE_PR_TOKEN.
on:
    workflow_call:
        secrets:
            # It lives in the caller's release environment, but the caller still has to pass it by name
            # (RELEASE_PR_TOKEN: ${{ secrets.RELEASE_PR_TOKEN }}) or it arrives empty.
            RELEASE_PR_TOKEN:
                required: true

jobs:
    release-pr:
        runs-on: ubuntu-latest
        concurrency: release-pr-${{ github.ref }}
        # The calling repo's environment. Only stage branches may use it, so a PR's workflow can't read the token.
        environment: release
        steps:
            - uses: actions/checkout@v6
              with:
                  fetch-depth: 0
            # shortcut: the script always comes from main, so a caller pinned to another ref of this workflow still
            # gets main's script; pin both if a caller ever needs that.
            - uses: actions/checkout@v6
              with:
                  repository: avalanche-canada/.github
                  path: .release-pr
                  sparse-checkout: .github/scripts
            - run: |
                  case $GITHUB_REF_NAME in
                      dev) next='qa staging' ;;
                      qa) next=staging ;;
                      *) next= ;;
                  esac
                  base=$DEFAULT_BRANCH
                  for b in $next; do
                      if git rev-parse -q --verify "refs/remotes/origin/$b" >/dev/null; then
                          base=$b
                          break
                      fi
                  done
                  .release-pr/.github/scripts/release-pr.sh "$GITHUB_REF_NAME" "$base"
              env:
                  DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
                  # Not GITHUB_TOKEN: PRs and merges made with it don't trigger the required checks or the next stage.
                  GH_TOKEN: ${{ secrets.RELEASE_PR_TOKEN }}
